name: تحديث نتائج كأس العالم 2026

on:
  schedule:
    # 4 مرات يومياً بتوقيت السعودية (UTC+3)
    # 3:00 صباحاً  = 00:00 UTC
    # 9:00 صباحاً = 06:00 UTC
    # 3:00 ظهراً  = 12:00 UTC
    # 9:00 مساءً  = 18:00 UTC
    
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تحديث النتائج
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          AF_API_KEY: ${{ secrets.AF_API_KEY }}
        run: node update.js
